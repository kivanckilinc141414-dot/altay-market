name: True Android Manifest Scanner

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install aapt for Android Manifest parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt

      - name: Run Manifest Parser & Multi-Format Icon Matcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import json
          import urllib.request
          import subprocess
          import re

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          
          apps_dict = {}

          # 0. Tüm logo formatlarını (.png, .jpg, .jpeg, .webp, .svg, .ico, .gif) önbellekle
          available_icons = {}
          if os.path.exists("icons"):
              for root, dirs, files in os.walk("icons"):
                  for file in files:
                      if file.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico', '.gif')):
                          rel_path = os.path.join(root, file).replace("\\", "/")
                          base_name = os.path.splitext(file)[0].lower()
                          available_icons[base_name] = rel_path
                          clean_base = re.sub(r'[^a-z0-9]', '', base_name)
                          available_icons[clean_base] = rel_path

          def find_icon(identifier):
              if not identifier:
                  return ""
              clean_id = identifier.lower().replace('.apk', '')
              super_clean_id = re.sub(r'[^a-z0-9]', '', clean_id)
              
              if clean_id in available_icons:
                  return available_icons[clean_id]
              if super_clean_id in available_icons:
                  return available_icons[super_clean_id]
                  
              for key, path in available_icons.items():
                  if key in super_clean_id or super_clean_id in key:
                      return path
              return ""

          def get_manifest_app_name(apk_path):
              """aapt kullanarak AndroidManifest.xml içindeki gerçek uygulama adını okur"""
              try:
                  result = subprocess.run(['aapt', 'dump', 'badging', apk_path], 
                                          stdout=subprocess.PIPE, 
                                          stderr=subprocess.PIPE, 
                                          text=True, 
                                          timeout=15)
                  output = result.stdout
                  
                  # Önce Türkçe uygulama adına bak, bulamazsan genel uygulama adına bak
                  tr_match = re.search(r"application-label-tr:'([^']+)'", output)
                  if tr_match:
                      return tr_match.group(1)
                      
                  label_match = re.search(r"application-label:'([^']+)'", output)
                  if label_match:
                      return label_match.group(1)
              except Exception as e:
                  print(f"aapt okuma hatası: {e}")
              return None

          # 1. GitHub Releases Taraması
          url = f"https://api.github.com/repos/{repo}/releases"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "vnd.github+json"
          })

          try:
              with urllib.request.urlopen(req) as response:
                  releases = json.loads(response.read().decode())
                  for release in releases:
                      for asset in release.get('assets', []):
                          asset_name = asset.get('name', '')
                          if asset_name.endswith('.apk'):
                              download_url = asset.get('browser_download_url', '')
                              size_bytes = asset.get('size', 0)
                              
                              if size_bytes > 1024 * 1024:
                                  file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                              else:
                                  file_size = f"{size_bytes / 1024:.1f} KB"
                              
                              # APK'yı geçici olarak indirip içindeki XML manifestini oku
                              temp_apk = f"temp_{asset_name}"
                              urllib.request.urlretrieve(download_url, temp_apk)
                              
                              manifest_name = get_manifest_app_name(temp_apk)
                              
                              if os.path.exists(temp_apk):
                                  os.remove(temp_apk)
                              
                              # Eğer manifestten isim okunamazsa dosya adını temizleyerek yedek al
                              if not manifest_name:
                                  clean_fallback = asset_name.replace('.apk', '').replace('_', ' ').replace('-', ' ')
                                  manifest_name = clean_fallback.title()

                              icon_path = find_icon(asset_name)

                              print(f"OKUNAN MANIFEST İSİM: {manifest_name} | DOSYA: {asset_name}")

                              apps_dict[asset_name] = {
                                  "name": manifest_name,
                                  "fileName": asset_name,
                                  "downloadUrl": download_url,
                                  "fileSize": file_size,
                                  "icon": icon_path
                              }
          except Exception as e:
              print(f"Releases taranırken hata: {e}")

          # 2. Repo İçi Dosya Taraması (Yedek)
          for root, dirs, files in os.walk("."):
              if ".git" in root or "icons" in root:
                  continue
              for file in files:
                if file.endswith('.apk') and file not in apps_dict:
                    file_path = os.path.join(root, file)
                    size_bytes = os.path.getsize(file_path)
                    
                    if size_bytes > 1024 * 1024:
                        file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                    else:
                        file_size = f"{size_bytes / 1024:.1f} KB"
                    
                    manifest_name = get_manifest_app_name(file_path)
                    if not manifest_name:
                        manifest_name = file.replace('.apk', '').replace('_', ' ').replace('-', ' ').title()
                        
                    download_url = f"https://raw.githubusercontent.com/{repo}/main/{file}"
                    icon_path = find_icon(file)

                    apps_dict[file] = {
                        "name": manifest_name,
                        "fileName": file,
                        "downloadUrl": download_url,
                        "fileSize": file_size,
                        "icon": icon_path
                    }

          apps_list = list(apps_dict.values())
          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps_list, f, ensure_ascii=False, indent=4)
          print(f"Toplam {len(apps_list)} uygulama manifest verileriyle işlendi.")
          EOF

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.github.com"
          git add apps.json
          git diff --staged --quiet || (git commit -m "Auto-scan: extract exact app name from AndroidManifest via aapt" && git push)
