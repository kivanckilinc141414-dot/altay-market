name: Auto Generate Apps and Icons from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Releases APK Icon ve apps.json Üretici
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        import os
        import json
        import zipfile
        import urllib.request

        repo = os.environ.get("GITHUB_REPOSITORY")
        token = os.environ.get("GITHUB_TOKEN")

        headers = {
            "User-Agent": "GitHub-Action",
            "Accept": "application/vnd.github.v3+json"
        }
        if token:
            headers["Authorization"] = f"token {token}"

        url = f"https://api.github.com/repos/{repo}/releases"
        req = urllib.request.Request(url, headers=headers)

        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        try:
            with urllib.request.urlopen(req) as response:
                releases = json.loads(response.read().decode())
                
                for release in releases:
                    for asset in release.get("assets", []):
                        file_name = asset["name"]
                        if file_name.lower().endswith(".apk"):
                            download_url = asset["browser_download_url"]
                            temp_apk = "temp_download.apk"

                            print(f"Indiriliyor: {file_name}...")
                            
                            # APK dosyasini gecici olarak indir
                            dl_req = urllib.request.Request(download_url, headers={"User-Agent": "GitHub-Action"})
                            with urllib.request.urlopen(dl_req) as dl_res, open(temp_apk, "wb") as out_file:
                                out_file.write(dl_res.read())

                            app_name = os.path.splitext(file_name)[0]
                            icon_filename = f"{app_name}.png"
                            icon_path = os.path.join("icons", icon_filename)

                            # APK icinden ikonu cikart
                            try:
                                with zipfile.ZipFile(temp_apk, 'r') as zip_ref:
                                    icon_bytes = None
                                    for item in zip_ref.namelist():
                                        if 'ic_launcher.png' in item or 'app_icon.png' in item or 'icon.png' in item:
                                            icon_bytes = zip_ref.read(item)
                                            break
                                    
                                    if icon_bytes:
                                        with open(icon_path, "wb") as f:
                                            f.write(icon_bytes)
                            except Exception as e:
                                print(f"{file_name} okunurken hata: {e}")
                            finally:
                                if os.path.exists(temp_apk):
                                    os.remove(temp_apk)

                            apps_list.append({
                                "name": app_name.replace("_", " ").replace("-", " ").title(),
                                "fileName": file_name,
                                "downloadUrl": download_url,
                                "icon": f"icons/{icon_filename}" if os.path.exists(icon_path) else ""
                            })

        except Exception as e:
            print(f"API Hatasi: {e}")

        print(f"Toplam Bulunan Release APK Sayisi: {len(apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Releases APK ikonları ve apps.json güncellendi" && git push)
