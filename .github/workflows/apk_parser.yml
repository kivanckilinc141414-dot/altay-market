name: Auto Generate Apps and Icons from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: AAPT Kurulumu (APK İnceleme Aracı)
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Releases APK Icon ve apps.json Üretici
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        import os
        import json
        import zipfile
        import urllib.request
        import subprocess
        import re

        repo = os.environ.get("GITHUB_REPOSITORY")
        token = os.environ.get("GITHUB_TOKEN")

        headers = {
            "User-Agent": "GitHub-Action",
            "Accept": "application/vnd.github.v3+json"
        }
        if token:
            headers["Authorization"] = f"token {token}"

        url = f"https://api.github.com/repos/{repo}/releases"
        req = urllib.request.Request(url, headers=headers)

        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        try:
            with urllib.request.urlopen(req) as response:
                releases = json.loads(response.read().decode())
                
                for release in releases:
                    for asset in release.get("assets", []):
                        file_name = asset["name"]
                        if file_name.lower().endswith(".apk"):
                            download_url = asset["browser_download_url"]
                            temp_apk = "temp_download.apk"

                            print(f"İndiriliyor ve İnceleniyor: {file_name}...")
                            dl_req = urllib.request.Request(download_url, headers={"User-Agent": "GitHub-Action"})
                            with urllib.request.urlopen(dl_req) as dl_res, open(temp_apk, "wb") as out_file:
                                out_file.write(dl_res.read())

                            app_name = os.path.splitext(file_name)[0]
                            icon_in_apk = None

                            # 1. AAPT ile APK'nın içindeki orijinal uygulama adını ve ikon yolunu çek
                            try:
                                cmd_res = subprocess.run(["aapt", "dump", "badging", temp_apk], capture_output=True, text=True)
                                out = cmd_res.stdout

                                # Gerçek Ekran İsmini Al (application-label)
                                label_match = re.search(r"application-label(?:-[a-zA-Z]+)?:'([^']+)'", out) or re.search(r"application:\s*label='([^']+)'", out)
                                if label_match:
                                    app_name = label_match.group(1)

                                # Gerçek İkon Yolunu Al
                                icons = re.findall(r"application-icon-\d+:'([^']+)'", out) or re.findall(r"icon='([^']+)'", out)
                                if icons:
                                    icon_in_apk = icons[-1] # En yüksek çözünürlüklü ikonu seçer
                            except Exception as e:
                                print(f"AAPT Okuma Hatası: {e}")

                            # 2. İkonu Çıkart ve icons/ Klasörüne Kaydet
                            icon_filename_base = os.path.splitext(file_name)[0]
                            icon_path = ""
                            extracted = False

                            try:
                                with zipfile.ZipFile(temp_apk, 'r') as zip_ref:
                                    if icon_in_apk and icon_in_apk in zip_ref.namelist():
                                        # Orijinal uzantıyı koru (.png, .webp, .jpg)
                                        ext = os.path.splitext(icon_in_apk)[1].lower()
                                        if not ext: ext = ".png" # Uzantı yoksa png varsay
                                        
                                        # JPG uzantilarini standardize et
                                        if ext == ".jpeg": ext = ".jpg"
                                        
                                        full_icon_filename = f"{icon_filename_base}{ext}"
                                        icon_path = os.path.join("icons", full_icon_filename)
                                        
                                        with open(icon_path, "wb") as f:
                                            f.write(zip_ref.read(icon_in_apk))
                                        extracted = True
                                        print(f"  İkon AAPT ile çıkarıldı: {icon_in_apk} -> {full_icon_filename}")
                                    else:
                                        # Alternatif ikon taraması (.png, .webp, .jpg, .jpeg)
                                        valid_extensions = ('.png', '.webp', '.jpg', '.jpeg')
                                        for item in zip_ref.namelist():
                                            if ('ic_launcher' in item or 'app_icon' in item) and (item.lower().endswith(valid_extensions)):
                                                ext = os.path.splitext(item)[1].lower()
                                                if ext == ".jpeg": ext = ".jpg"
                                                full_icon_filename = f"{icon_filename_base}{ext}"
                                                icon_path = os.path.join("icons", full_icon_filename)
                                                
                                                with open(icon_path, "wb") as f:
                                                    f.write(zip_ref.read(item))
                                                extracted = True
                                                print(f"  İkon tarama ile çıkarıldı: {item} -> {full_icon_filename}")
                                                break
                            except Exception as e:
                                print(f"İkon Çıkarma Hatası: {e}")

                            if os.path.exists(temp_apk):
                                os.remove(temp_apk)

                            apps_list.append({
                                "name": app_name,
                                "fileName": file_name,
                                "downloadUrl": download_url,
                                "icon": f"icons/{os.path.basename(icon_path)}" if extracted else ""
                            })

        except Exception as e:
            print(f"API Hatası: {e}")

        print(f"Toplam İşlenen APK Sayısı: {len(apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Değişiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: APK imzalı isimleri ve ikonları (JPG destekli) güncellendi" && git push)
