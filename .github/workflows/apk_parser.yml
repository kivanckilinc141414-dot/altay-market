name: Ultimate Altay Market Scanner v3

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Ultimate App & Version Scanner v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import json
          import urllib.request
          import re

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          
          apps_dict = {}

          # 0. İkonları önbellekle
          available_icons = {}
          if os.path.exists("icons"):
              for root, dirs, files in os.walk("icons"):
                  for file in files:
                      if file.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico')):
                          base_name = os.path.splitext(file)[0].lower()
                          available_icons[base_name] = os.path.join(root, file).replace("\\", "/")
                          clean_base = re.sub(r'[^a-z0-9]', '', base_name)
                          available_icons[clean_base] = os.path.join(root, file).replace("\\", "/")

          def find_best_icon(identifier):
              if not identifier:
                  return ""
              clean_id = identifier.lower().replace('.apk', '')
              super_clean_id = re.sub(r'[^a-z0-9]', '', clean_id)
              if clean_id in available_icons:
                  return available_icons[clean_id]
              if super_clean_id in available_icons:
                  return available_icons[super_clean_id]
              for key, path in available_icons.items():
                  if key in super_clean_id or super_clean_id in key:
                      return path
              return ""

          def clean_app_name(filename):
              # Uzantıyı kaldır
              name = filename.replace('.apk', '')
              
              # Paket adı formatındaysa (örn: org.telegram.messenger) son parçayı al
              if '.' in name and not name.startswith('v'):
                  parts = name.split('.')
                  # Son parça sayı değilse onu isim olarak al
                  potential_name = parts[-1]
                  if not potential_name.isdigit():
                      name = potential_name

              # Mimari ve sürüm eklerini temizle (arm64, v7a, release, _v1.2 vb.)
              name = re.sub(r'[-_]?(arm64|armeabi|v7a|x86|universal|release|debug|nightly).*$', '', name, flags=re.IGNORECASE)
              name = re.sub(r'[-_v]?\d+[\d\.]*$', '', name)
              
              # Alt çizgi ve tireleri boşluğa çevir
              name = name.replace('_', ' ').replace('-', ' ').strip()
              
              # Bilinen popüler uygulamalar sözlüğü (Garanti çözüm)
              known_apps = {
                  'fdroid': 'F-Droid',
                  'f-droid': 'F-Droid',
                  'newpipe': 'NewPipe',
                  'telegram': 'Telegram',
                  'whatsapp': 'WhatsApp',
                  'spotify': 'Spotify',
                  'minecraft': 'Minecraft',
                  'discord': 'Discord',
                  'youtube': 'YouTube',
                  'revanced': 'ReVanced'
              }
              
              lower_key = name.lower().replace(' ', '')
              if lower_key in known_apps:
                  return known_apps[lower_key]
              
              return name.title() if len(name) > 1 else filename.replace('.apk', '').title()

          def extract_version(tag, filename):
              # 1. Tag içinde sürüm ara (örn: v1.16.0 veya 2.4)
              if tag:
                  m = re.search(r'v?(\d+[\d\.]*)', tag)
                  if m:
                      return m.group(1)
              
              # 2. Dosya adında sürüm ara (örn: _v1.2.3.apk veya -1.5.apk)
              if filename:
                  # Önce alt çizgi veya tireden sonra gelen versiyonları ara
                  m = re.search(r'[-_v](\d+[\d\.]+\d+)', filename)
                  if m:
                      return m.group(1)
                  # Genel sayı kalıbı ara
                  m = re.search(r'(\d+\.\d+[\d\.]*)', filename)
                  if m:
                      return m.group(1)
                      
              return "1.0"

          # 1. GitHub Releases Taraması
          url = f"https://api.github.com/repos/{repo}/releases"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "vnd.github+json"
          })

          try:
              with urllib.request.urlopen(req) as response:
                  releases = json.loads(response.read().decode())
                  for release in releases:
                      tag_name = release.get('tag_name', '').strip()
                      
                      for asset in release.get('assets', []):
                          asset_name = asset.get('name', '')
                          if asset_name.endswith('.apk'):
                              download_url = asset.get('browser_download_url', '')
                              size_bytes = asset.get('size', 0)
                              
                              if size_bytes > 1024 * 1024:
                                  file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                              else:
                                  file_size = f"{size_bytes / 1024:.1f} KB"
                              
                              app_name = clean_app_name(asset_name)
                              version = extract_version(tag_name, asset_name)
                              icon_path = find_best_icon(asset_name)

                              print(f"BULUNAN (Release): İsim -> {app_name}, Sürüm -> {version}, Dosya -> {asset_name}")

                              apps_dict[asset_name] = {
                                  "name": app_name,
                                  "fileName": asset_name,
                                  "downloadUrl": download_url,
                                  "fileSize": file_size,
                                  "version": version,
                                  "icon": icon_path
                              }
          except Exception as e:
              print(f"Releases taranırken hata: {e}")

          # 2. Repo İçi Dosya Taraması (Yedek)
          for root, dirs, files in os.walk("."):
              if ".git" in root or "icons" in root:
                  continue
              for file in files:
                if file.endswith('.apk') and file not in apps_dict:
                    file_path = os.path.join(root, file)
                    size_bytes = os.path.getsize(file_path)
                    
                    if size_bytes > 1024 * 1024:
                        file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                    else:
                        file_size = f"{size_bytes / 1024:.1f} KB"
                    
                    app_name = clean_app_name(file)
                    version = extract_version("", file)
                    download_url = f"https://raw.githubusercontent.com/{repo}/main/{file}"
                    icon_path = find_best_icon(file)

                    print(f"BULUNAN (Local): İsim -> {app_name}, Sürüm -> {version}, Dosya -> {file}")

                    apps_dict[file] = {
                        "name": app_name,
                        "fileName": file,
                        "downloadUrl": download_url,
                        "fileSize": file_size,
                        "version": version,
                        "icon": icon_path
                    }

          apps_list = list(apps_dict.values())
          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps_list, f, ensure_ascii=False, indent=4)
          print(f"Toplam {len(apps_list)} uygulama başarıyla işlendi ve apps.json kaydedildi.")
          EOF

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.github.com"
          git add apps.json
          git diff --staged --quiet || (git commit -m "Auto-scan: fix app names and versions precisely v3" && git push)
