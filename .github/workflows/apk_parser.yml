name: Auto Generate Apps and Icons

on:
  push:
    branches:
      - main
    paths:
      - '**.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: APK Icon ve apps.json Üretici
      run: |
        import os
        import json
        import zipfile

        RAW_BASE_URL = f"https://raw.githubusercontent.com/{os.environ.get('GITHUB_REPOSITORY')}/main/"
        
        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        for file in sorted(os.listdir(".")):
            if file.endswith(".apk"):
                app_name = os.path.splitext(file)[0]
                icon_filename = f"{app_name}.png"
                icon_path = os.path.join("icons", icon_filename)

                # APK içinden varsayılan ikonu ayıkla
                try:
                    with zipfile.ZipFile(file, 'r') as zip_ref:
                        icon_bytes = None
                        # En yaygın ikon yollarını tara
                        for item in zip_ref.namelist():
                            if 'ic_launcher.png' in item or 'app_icon.png' in item:
                                icon_bytes = zip_ref.read(item)
                                break
                        
                        if icon_bytes:
                            with open(icon_path, "wb") as f:
                                f.write(icon_bytes)
                except Exception as e:
                    print(f"{file} okunurken hata: {e}")

                apps_list.append({
                    "name": app_name.replace("_", " ").replace("-", " ").title(),
                    "fileName": file,
                    "downloadUrl": RAW_BASE_URL + file,
                    "icon": f"icons/{icon_filename}" if os.path.exists(icon_path) else ""
                })

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: APK ikonları ve apps.json güncellendi" && git push)
