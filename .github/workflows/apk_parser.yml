name: APK Auto Parser

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  parse-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install pyaxmlparser requests

      - name: APK'ları İndir, Ayrıştır ve JSON Üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os, json, requests
          from pyaxmlparser import APK

          repo = os.environ.get('GITHUB_REPOSITORY')
          token = os.environ.get('GH_TOKEN')
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}

          rel_url = f'https://api.github.com/repos/{repo}/releases/latest'
          res = requests.get(rel_url, headers=headers).json()

          assets = res.get('assets', [])
          apk_assets = [a for a in assets if a['name'].lower().endswith('.apk')]

          os.makedirs('icons', exist_ok=True)
          apps_data = []

          for asset in apk_assets:
              apk_name = asset['name']
              download_url = asset['browser_download_url']
              local_apk = f'/tmp/{apk_name}'

              r = requests.get(download_url, stream=True)
              with open(local_apk, 'wb') as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

              try:
                  app = APK(local_apk)
                  app_name = app.get_app_name() or apk_name.replace('.apk', '')
                  pkg_name = app.package or 'app'

                  icon_data = app.get_file(app.get_icon())
                  icon_filename = f'icons/{pkg_name}.png'
                  if icon_data:
                      with open(icon_filename, 'wb') as f:
                          f.write(icon_data)
                      icon_url = icon_filename
                  else:
                      icon_url = 'https://via.placeholder.com/76'

                  apps_data.append({
                      'name': app_name,
                      'fileName': apk_name,
                      'downloadUrl': download_url,
                      'icon': icon_url
                  })
                  print(f'Başarıyla ayrıştırıldı: {app_name}')
              except Exception as e:
                  print(f'Hata ({apk_name}): {e}')

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps_data, f, ensure_ascii=False, indent=2)
          "

      - name: Oluşan Dosyaları Repoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update apps.json and extracted icons" && git push)
