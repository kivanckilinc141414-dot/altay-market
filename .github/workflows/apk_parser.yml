name: Auto Generate Apps and Icons

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Depodaki Tum Dosyalari Listele (Debug)
      run: |
        echo "=== REPODAKI DOSYALAR ==="
        find . -maxdepth 3 -not -path '*/.*'

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: APK Icon ve apps.json Üretici
      run: |
        import os
        import json
        import zipfile

        RAW_BASE_URL = f"https://raw.githubusercontent.com/{os.environ.get('GITHUB_REPOSITORY')}/main/"
        
        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        for root, dirs, files in os.walk("."):
            if ".git" in root or ".github" in root or "icons" in root:
                continue

            for file in sorted(files):
                if file.lower().endswith(".apk"):
                    rel_dir = os.path.relpath(root, ".").replace("\\", "/")
                    file_path = os.path.join(root, file) if rel_dir != "." else file
                    raw_file_url = RAW_BASE_URL + (f"{rel_dir}/{file}" if rel_dir != "." else file)

                    app_name = os.path.splitext(file)[0]
                    icon_filename = f"{app_name}.png"
                    icon_path = os.path.join("icons", icon_filename)

                    try:
                        with zipfile.ZipFile(file_path, 'r') as zip_ref:
                            icon_bytes = None
                            for item in zip_ref.namelist():
                                if 'ic_launcher.png' in item or 'app_icon.png' in item or 'icon.png' in item:
                                    icon_bytes = zip_ref.read(item)
                                    break
                            
                            if icon_bytes:
                                with open(icon_path, "wb") as f:
                                    f.write(icon_bytes)
                    except Exception as e:
                        print(f"{file} okunurken hata: {e}")

                    apps_list.append({
                        "name": app_name.replace("_", " ").replace("-", " ").title(),
                        "fileName": file,
                        "downloadUrl": raw_file_url,
                        "icon": f"icons/{icon_filename}" if os.path.exists(icon_path) else ""
                    })

        print(f"Bulunan APK Sayisi: {len(apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: APK ikonları ve apps.json güncellendi" && git push)
