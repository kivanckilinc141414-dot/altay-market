name: Auto Generate Apps and Icons from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited, created, deleted, released]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: AAPT ve Sistem Araclarini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt imagemagick

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Gerekli Python Paketlerini Yükle
      run: |
        python -m pip install --upgrade pip
        pip install Pillow requests

    - name: Akıllı JSON Güncelleyici
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        import os
        import json
        import zipfile
        import urllib.request
        import subprocess
        import re
        import requests
        from PIL import Image

        repo = os.environ.get("GITHUB_REPOSITORY")
        token = os.environ.get("GITHUB_TOKEN")

        headers = {
            "User-Agent": "GitHub-Action",
            "Accept": "application/vnd.github.v3+json"
        }
        if token:
            headers["Authorization"] = f"token {token}"

        url = f"https://api.github.com/repos/{repo}/releases"
        req = urllib.request.Request(url, headers=headers)

        if not os.path.exists("icons"):
            os.makedirs("icons")

        # 1. Mevcut apps.json dosyasını oku (Elle yapılan değişiklikleri korumak için)
        existing_apps = []
        if os.path.exists("apps.json"):
            try:
                with open("apps.json", "r", encoding="utf-8") as f:
                    existing_apps = json.load(f)
            except Exception:
                pass
        
        # Kolay arama yapmak için bir sözlük (dictionary) oluştur
        existing_dict = {app["fileName"]: app for app in existing_apps}
        new_apps_list = []

        try:
            with urllib.request.urlopen(req) as response:
                releases = json.loads(response.read().decode())
                
                for release in releases:
                    for asset in release.get("assets", []):
                        file_name = asset["name"]
                        if file_name.lower().endswith(".apk"):
                            download_url = asset["browser_download_url"]
                            
                            # 2. EĞER UYGULAMA ZATEN JSON'DA VARSA (İşlemi hızlandır, tekrar indirme)
                            if file_name in existing_dict:
                                print(f"Zaten mevcut, atlanıyor: {file_name}")
                                app_data = existing_dict[file_name]
                                app_data["downloadUrl"] = download_url # Sadece indirme linkini güncel tut
                                new_apps_list.append(app_data)
                                continue
                            
                            # 3. YENİ BİR UYGULAMAYSA İNDİR VE İKON ÇIKART
                            temp_apk = "temp_download.apk"
                            print(f"\n--- YENİ UYGULAMA İŞLENİYOR: {file_name} ---")
                            dl_req = urllib.request.Request(download_url, headers={"User-Agent": "GitHub-Action"})
                            with urllib.request.urlopen(dl_req) as dl_res, open(temp_apk, "wb") as out_file:
                                out_file.write(dl_res.read())

                            app_name = os.path.splitext(file_name)[0]
                            package_name = None
                            aapt_icon_path = None

                            try:
                                cmd_res = subprocess.run(["aapt", "dump", "badging", temp_apk], capture_output=True, text=True)
                                out = cmd_res.stdout
                                pkg_match = re.search(r"package:\s*name='([^']+)'", out)
                                if pkg_match: package_name = pkg_match.group(1)
                                label_match = re.search(r"application-label(?:-[a-zA-Z]+)?:'([^']+)'", out) or re.search(r"application:\s*label='([^']+)'", out)
                                if label_match: app_name = label_match.group(1)
                                icons = re.findall(r"application-icon-\d+:'([^']+)'", out) or re.findall(r"icon='([^']+)'", out)
                                if icons: aapt_icon_path = icons[-1]
                            except Exception as e:
                                print(f"AAPT Hatasi: {e}")

                            icon_filename = f"{os.path.splitext(file_name)[0]}.png"
                            icon_path = os.path.join("icons", icon_filename)
                            temp_raw_icon = "temp_raw_icon"
                            extracted = False

                            if aapt_icon_path and not aapt_icon_path.endswith('.xml'):
                                try:
                                    with zipfile.ZipFile(temp_apk, 'r') as zip_ref:
                                        if aapt_icon_path in zip_ref.namelist():
                                            with open(temp_raw_icon, "wb") as f:
                                                f.write(zip_ref.read(aapt_icon_path))
                                            with Image.open(temp_raw_icon) as img:
                                                img.convert("RGBA").save(icon_path, "PNG")
                                            extracted = True
                                            print(f"  [APK İçi] PNG Çıkarıldı.")
                                except: pass

                            if not extracted and package_name:
                                try:
                                    store_url = f"https://play.google.com/store/apps/details?id={package_name}"
                                    res = requests.get(store_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=5)
                                    if res.status_code == 200:
                                        img_match = re.search(r'(https://play-lh\.googleusercontent\.com/[^"\'\s=]+)', res.text)
                                        if img_match:
                                            hd_icon_url = img_match.group(1) + "=w512-h512"
                                            img_bytes = requests.get(hd_icon_url, timeout=5).content
                                            with open(icon_path, "wb") as f:
                                                f.write(img_bytes)
                                            extracted = True
                                            print(f"  [Play Store] HD İkon Çekildi.")
                                except: pass

                            if not extracted and ("uptodown" in app_name.lower() or "uptodown" in str(package_name).lower()):
                                try:
                                    up_res = requests.get("https://uptodown-app-store.en.uptodown.com/android", headers={"User-Agent": "Mozilla/5.0"}, timeout=5)
                                    img_match = re.search(r'(https://img\.utdstc\.com/icon/[^"\'\s]+)', up_res.text)
                                    if img_match:
                                        img_bytes = requests.get(img_match.group(1), timeout=5).content
                                        with open(icon_path, "wb") as f:
                                            f.write(img_bytes)
                                        extracted = True
                                        print("  [Uptodown] İkon İndirildi.")
                                except: pass

                            if os.path.exists(temp_apk): os.remove(temp_apk)
                            if os.path.exists(temp_raw_icon): os.remove(temp_raw_icon)

                            new_apps_list.append({
                                "name": app_name,
                                "fileName": file_name,
                                "downloadUrl": download_url,
                                "icon": f"icons/{icon_filename}" if extracted else ""
                            })

        except Exception as e:
            print(f"API Hatasi: {e}")

        # 4. GEREKSİZ/SİLİNMİŞ İKONLARI TEMİZLE
        kept_icons = [app.get("icon", "") for app in new_apps_list if app.get("icon")]
        for icon_file in os.listdir("icons"):
            icon_path = f"icons/{icon_file}"
            if icon_path not in kept_icons:
                try:
                    os.remove(icon_path)
                    print(f"Çöp ikon temizlendi: {icon_path}")
                except Exception as e:
                    print(f"Silme hatası: {e}")

        print(f"\nToplam Güncel APK Sayısı: {len(new_apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(new_apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: apps.json akıllı güncellendi (Sadece yeni eklenen/silinenler işlendi)" && git push)
