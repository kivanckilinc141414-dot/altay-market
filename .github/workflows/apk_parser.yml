name: Auto Generate Apps and Icons from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Sistem Araclarini Kur (AAPT ve ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt imagemagick

    - name: Python ve Pillow Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Gerekli Python Paketlerini Yükle
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: Releases APK Icon ve apps.json Üretici
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        import os
        import json
        import zipfile
        import urllib.request
        import subprocess
        import re
        from PIL import Image

        repo = os.environ.get("GITHUB_REPOSITORY")
        token = os.environ.get("GITHUB_TOKEN")

        headers = {
            "User-Agent": "GitHub-Action",
            "Accept": "application/vnd.github.v3+json"
        }
        if token:
            headers["Authorization"] = f"token {token}"

        url = f"https://api.github.com/repos/{repo}/releases"
        req = urllib.request.Request(url, headers=headers)

        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        try:
            with urllib.request.urlopen(req) as response:
                releases = json.loads(response.read().decode())
                
                for release in releases:
                    for asset in release.get("assets", []):
                        file_name = asset["name"]
                        if file_name.lower().endswith(".apk"):
                            download_url = asset["browser_download_url"]
                            temp_apk = "temp_download.apk"

                            print(f"İndiriliyor ve İşleniyor: {file_name}...")
                            dl_req = urllib.request.Request(download_url, headers={"User-Agent": "GitHub-Action"})
                            with urllib.request.urlopen(dl_req) as dl_res, open(temp_apk, "wb") as out_file:
                                out_file.write(dl_res.read())

                            app_name = os.path.splitext(file_name)[0]
                            icon_in_apk = None

                            # 1. AAPT ile Orijinal Isim ve Ikon Yolu Bul
                            try:
                                cmd_res = subprocess.run(["aapt", "dump", "badging", temp_apk], capture_output=True, text=True)
                                out = cmd_res.stdout

                                label_match = re.search(r"application-label(?:-[a-zA-Z]+)?:'([^']+)'", out) or re.search(r"application:\s*label='([^']+)'", out)
                                if label_match:
                                    app_name = label_match.group(1)

                                icons = re.findall(r"application-icon-\d+:'([^']+)'", out) or re.findall(r"icon='([^']+)'", out)
                                if icons:
                                    icon_in_apk = icons[-1]
                            except Exception as e:
                                print(f"AAPT Okuma Hatasi: {e}")

                            # 2. Ikonu Cikart ve Temizle
                            icon_filename = f"{os.path.splitext(file_name)[0]}.png"
                            icon_path = os.path.join("icons", icon_filename)
                            temp_raw_icon = "temp_raw_icon"
                            extracted = False

                            try:
                                with zipfile.ZipFile(temp_apk, 'r') as zip_ref:
                                    target_icon = None
                                    
                                    # Önce AAPT yoluna bak, XML değilse seç
                                    if icon_in_apk and icon_in_apk in zip_ref.namelist() and not icon_in_apk.endswith('.xml'):
                                        target_icon = icon_in_apk
                                    else:
                                        # Alternatif PNG/WEBP/JPG taraması (en büyük resim dosyasını seçer)
                                        valid_files = [
                                            item for item in zip_ref.namelist()
                                            if ('ic_launcher' in item or 'app_icon' in item or 'icon' in item)
                                            and item.lower().endswith(('.png', '.webp', '.jpg', '.jpeg'))
                                            and not item.endswith('.xml')
                                        ]
                                        if valid_files:
                                            # Dosya boyutuna göre sırala (En yüksek kaliteli/çözünürlüklü olanı al)
                                            valid_files.sort(key=lambda x: zip_ref.getinfo(x).file_size, reverse=True)
                                            target_icon = valid_files[0]

                                    if target_icon:
                                        with open(temp_raw_icon, "wb") as f:
                                            f.write(zip_ref.read(target_icon))
                                        
                                        # Resmi PIL ile aç ve Standart PNG'ye dönüştür
                                        try:
                                            with Image.open(temp_raw_icon) as img:
                                                img.convert("RGBA").save(icon_path, "PNG")
                                                extracted = True
                                                print(f"  Görsel başarıyla PNG yapıldı: {target_icon}")
                                        except Exception:
                                            # PIL başarısız olursa ImageMagick ile dene
                                            subprocess.run(["convert", temp_raw_icon, icon_path])
                                            if os.path.exists(icon_path):
                                                extracted = True
                                                print(f"  ImageMagick ile PNG yapıldı: {target_icon}")

                            except Exception as e:
                                print(f"İkon Çıkarma Hatası: {e}")
                            finally:
                                if os.path.exists(temp_apk): os.remove(temp_apk)
                                if os.path.exists(temp_raw_icon): os.remove(temp_raw_icon)

                            apps_list.append({
                                "name": app_name,
                                "fileName": file_name,
                                "downloadUrl": download_url,
                                "icon": f"icons/{icon_filename}" if extracted else ""
                            })

        except Exception as e:
            print(f"API Hatasi: {e}")

        print(f"Toplam Islenen APK Sayisi: {len(apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: İkonlar %100 temiz PNG formatına dönüştürüldü" && git push)
