name: Ultimate Native APK Metadata Scanner

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install aapt for reading APK metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt

      - name: Run Native APK Parser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import json
          import urllib.request
          import subprocess
          import re

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          
          apps_dict = {}

          # 0. İkonları önbellekle
          available_icons = {}
          if os.path.exists("icons"):
              for root, dirs, files in os.walk("icons"):
                  for file in files:
                      if file.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico')):
                          base_name = os.path.splitext(file)[0].lower()
                          available_icons[base_name] = os.path.join(root, file).replace("\\", "/")
                          clean_base = re.sub(r'[^a-z0-9]', '', base_name)
                          available_icons[clean_base] = os.path.join(root, file).replace("\\", "/")

          def find_best_icon(identifier):
              if not identifier:
                  return ""
              clean_id = identifier.lower().replace('.apk', '')
              super_clean_id = re.sub(r'[^a-z0-9]', '', clean_id)
              if clean_id in available_icons:
                  return available_icons[clean_id]
              if super_clean_id in available_icons:
                  return available_icons[super_clean_id]
              for key, path in available_icons.items():
                  if key in super_clean_id or super_clean_id in key:
                      return path
              return ""

          def get_apk_metadata(apk_path):
              """aapt kullanarak APK'nın içindeki gerçek uygulama adını ve sürümünü okur"""
              app_name = None
              version_name = None
              try:
                  result = subprocess.run(['aapt', 'dump', 'badging', apk_path], 
                                          stdout=subprocess.PIPE, 
                                          stderr=subprocess.PIPE, 
                                          text=True, 
                                          timeout=15)
                  output = result.stdout
                  
                  # Gerçek sürüm adını yakala (versionName='...')
                  v_match = re.search(r"versionName='([^']+)'", output)
                  if v_match:
                      version_name = v_match.group(1)
                      
                  # Gerçek uygulama adını yakala (application-label:'...')
                  label_matches = re.findall(r"application-label(?:-[a-z]{2})?:'([^']+)'", output)
                  if label_matches:
                      app_name = label_matches[0]
              except Exception as e:
                  print(f"aapt okuma hatası ({apk_path}): {e}")
                  
              return app_name, version_name

          # 1. GitHub Releases Taraması
          url = f"https://api.github.com/repos/{repo}/releases"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "vnd.github+json"
          })

          try:
              with urllib.request.urlopen(req) as response:
                  releases = json.loads(response.read().decode())
                  for release in releases:
                      for asset in release.get('assets', []):
                          asset_name = asset.get('name', '')
                          if asset_name.endswith('.apk'):
                              download_url = asset.get('browser_download_url', '')
                              size_bytes = asset.get('size', 0)
                              
                              if size_bytes > 1024 * 1024:
                                  file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                              else:
                                  file_size = f"{size_bytes / 1024:.1f} KB"
                              
                              # APK'yı geçici indirip içini okuyalım
                              temp_apk = f"temp_{asset_name}"
                              print(f"İndiriliyor ve analiz ediliyor: {asset_name}...")
                              urllib.request.urlretrieve(download_url, temp_apk)
                              
                              embedded_name, embedded_version = get_apk_metadata(temp_apk)
                              
                              # Eğer içeriden okunamazsa dosya adından yedek türet
                              if not embedded_name or embedded_name.startswith('http'):
                                  embedded_name = asset_name.replace('.apk', '').replace('_', ' ').replace('-', ' ').title()
                              if not embedded_version:
                                  embedded_version = "1.0"
                                  
                              if os.path.exists(temp_apk):
                                  os.remove(temp_apk)
                                  
                              icon_path = find_best_icon(asset_name)

                              print(f" > İÇERİK OKUNDU: İsim -> {embedded_name} | Sürüm -> {embedded_version}")

                              apps_dict[asset_name] = {
                                  "name": embedded_name,
                                  "fileName": asset_name,
                                  "downloadUrl": download_url,
                                  "fileSize": file_size,
                                  "version": embedded_version,
                                  "icon": icon_path
                              }
          except Exception as e:
              print(f"Releases taranırken hata: {e}")

          # 2. Repo İçi Dosya Taraması (Yedek)
          for root, dirs, files in os.walk("."):
              if ".git" in root or "icons" in root:
                  continue
              for file in files:
                if file.endswith('.apk') and file not in apps_dict:
                    file_path = os.path.join(root, file)
                    size_bytes = os.path.getsize(file_path)
                    
                    if size_bytes > 1024 * 1024:
                        file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                    else:
                        file_size = f"{size_bytes / 1024:.1f} KB"
                    
                    embedded_name, embedded_version = get_apk_metadata(file_path)
                    if not embedded_name:
                        embedded_name = file.replace('.apk', '').replace('_', ' ').replace('-', ' ').title()
                    if not embedded_version:
                        embedded_version = "1.0"
                        
                    download_url = f"https://raw.githubusercontent.com/{repo}/main/{file}"
                    icon_path = find_best_icon(file)

                    print(f" > LOCAL İÇERİK OKUNDU: İsim -> {embedded_name} | Sürüm -> {embedded_version}")

                    apps_dict[file] = {
                        "name": embedded_name,
                        "fileName": file,
                        "downloadUrl": download_url,
                        "fileSize": file_size,
                        "version": embedded_version,
                        "icon": icon_path
                    }

          apps_list = list(apps_dict.values())
          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps_list, f, ensure_ascii=False, indent=4)
          print(f"Toplam {len(apps_list)} uygulama doğrudan APK içinden okunarak işlendi.")
          EOF

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.github.com"
          git add apps.json
          git diff --staged --quiet || (git commit -m "Auto-scan: extract real embedded app name and version via aapt" && git push)
