name: Ultimate Altay Market Scanner

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Ultimate App & Icon Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import json
          import urllib.request
          import re

          repo = os.environ['REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          
          apps_dict = {}

          # 0. ADIM: Depodaki 'icons' klasörünü derinlemesine tarayıp veritabanı oluşturalım
          available_icons = {}
          if os.path.exists("icons"):
              for root, dirs, files in os.walk("icons"):
                  for file in files:
                      if file.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.svg', '.ico')):
                          rel_path = os.path.join(root, file).replace("\\", "/")
                          # Dosya adını uzantısız ve küçük harfli al (örn: 'f-droid.png' -> 'f-droid')
                          base_name = os.path.splitext(file)[0].lower()
                          available_icons[base_name] = rel_path
                          
                          # Özel karakterlerden arındırılmış halini de ekle (örn: 'fdroid')
                          clean_base = re.sub(r'[^a-z0-9]', '', base_name)
                          available_icons[clean_base] = rel_path

          print(f"Bulunan toplam ikon sayısı: {len(available_icons)}")

          def find_best_icon(identifier):
              """Uygulama adına veya dosya adına göre en uygun ikonu bulan akıllı eşleştirici"""
              if not identifier:
                  return ""
              
              clean_id = identifier.lower().replace('.apk', '')
              super_clean_id = re.sub(r'[^a-z0-9]', '', clean_id)
              
              # 1. Tam eşleşme kontrolü
              if clean_id in available_icons:
                  return available_icons[clean_id]
              if super_clean_id in available_icons:
                  return available_icons[super_clean_id]
              
              # 2. İçeriyor mu kontrolü (Substring / Fuzzy match)
              for key, path in available_icons.items():
                  if key in super_clean_id or super_clean_id in key:
                      return path
                      
              return ""

          # 1. YÖNTEM: GitHub Releases Taraması
          url = f"https://api.github.com/repos/{repo}/releases"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "vnd.github+json"
          })

          try:
              with urllib.request.urlopen(req) as response:
                  releases = json.loads(response.read().decode())
                  for release in releases:
                      tag_name = release.get('tag_name', '').strip()
                      release_name = release.get('name', '').strip()
                      
                      version = tag_name.lstrip('vV') if tag_name else "1.0"
                      
                      for asset in release.get('assets', []):
                          asset_name = asset.get('name', '')
                          if asset_name.endswith('.apk'):
                              download_url = asset.get('browser_download_url', '')
                              size_bytes = asset.get('size', 0)
                              
                              if size_bytes > 1024 * 1024:
                                  file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                              else:
                                  file_size = f"{size_bytes / 1024:.1f} KB"
                              
                              app_name = release_name if release_name and release_name != tag_name else asset_name.replace('.apk', '').replace('_', ' ').replace('-', ' ').title()
                              
                              # Gelişmiş ikon bulucu çağrısı
                              icon_path = find_best_icon(asset_name)

                              apps_dict[asset_name] = {
                                  "name": app_name,
                                  "fileName": asset_name,
                                  "downloadUrl": download_url,
                                  "fileSize": file_size,
                                  "version": version,
                                  "icon": icon_path
                              }
          except Exception as e:
              print(f"Releases taranırken uyarı/hata: {e}")

          # 2. YÖNTEM: Repo İçi Dosya Taraması (Yedek)
          for root, dirs, files in os.walk("."):
              if ".git" in root or "icons" in root:
                  continue
              for file in files:
                if file.endswith('.apk') and file not in apps_dict:
                    file_path = os.path.join(root, file)
                    size_bytes = os.path.getsize(file_path)
                    
                    if size_bytes > 1024 * 1024:
                        file_size = f"{size_bytes / (1024 * 1024):.1f} MB"
                    else:
                        file_size = f"{size_bytes / 1024:.1f} KB"
                    
                    version_match = re.search(r'[vV]?(\d+\.\d+(\.\d+)?)', file)
                    version = version_match.group(1) if version_match else "1.0"
                    
                    app_name = file.replace('.apk', '').replace('_', ' ').replace('-', ' ').title()
                    download_url = f"https://raw.githubusercontent.com/{repo}/main/{file}"
                    
                    icon_path = find_best_icon(file)

                    apps_dict[file] = {
                        "name": app_name,
                        "fileName": file,
                        "downloadUrl": download_url,
                        "fileSize": file_size,
                        "version": version,
                        "icon": icon_path
                    }

          apps_list = list(apps_dict.values())
          
          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(apps_list, f, ensure_ascii=False, indent=4)
              
          print(f"Toplam {len(apps_list)} uygulama başarıyla taranıp apps.json dosyasına işlendi.")
          EOF

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.github.com"
          git add apps.json
          git diff --staged --quiet || (git commit -m "Auto-scan: ultimate version and robust icon matching update" && git push)
