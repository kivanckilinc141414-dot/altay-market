name: Auto Generate Apps and Icons from Releases

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: AAPT ve Sistem Araclarini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y aapt imagemagick

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Gerekli Python Paketlerini Yükle
      run: |
        python -m pip install --upgrade pip
        pip install Pillow pyaxmlparser requests

    - name: Releases APK Icon ve apps.json Üretici
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        import os
        import json
        import zipfile
        import urllib.request
        import subprocess
        import re
        import requests
        from PIL import Image
        from pyaxmlparser import APK

        repo = os.environ.get("GITHUB_REPOSITORY")
        token = os.environ.get("GITHUB_TOKEN")

        headers = {
            "User-Agent": "GitHub-Action",
            "Accept": "application/vnd.github.v3+json"
        }
        if token:
            headers["Authorization"] = f"token {token}"

        url = f"https://api.github.com/repos/{repo}/releases"
        req = urllib.request.Request(url, headers=headers)

        if not os.path.exists("icons"):
            os.makedirs("icons")

        apps_list = []

        try:
            with urllib.request.urlopen(req) as response:
                releases = json.loads(response.read().decode())
                
                for release in releases:
                    for asset in release.get("assets", []):
                        file_name = asset["name"]
                        if file_name.lower().endswith(".apk"):
                            download_url = asset["browser_download_url"]
                            temp_apk = "temp_download.apk"

                            print(f"İndiriliyor: {file_name}...")
                            dl_req = urllib.request.Request(download_url, headers={"User-Agent": "GitHub-Action"})
                            with urllib.request.urlopen(dl_req) as dl_res, open(temp_apk, "wb") as out_file:
                                out_file.write(dl_res.read())

                            app_name = os.path.splitext(file_name)[0]
                            package_name = None

                            # 1. PyAXMLParser ile APK Paket Bilgisini Çek
                            try:
                                apk_obj = APK(temp_apk)
                                package_name = apk_obj.package
                                if apk_obj.application:
                                    app_name = apk_obj.application
                            except Exception as e:
                                print(f"APK Parser Hatasi: {e}")

                            icon_filename = f"{os.path.splitext(file_name)[0]}.png"
                            icon_path = os.path.join("icons", icon_filename)
                            temp_raw_icon = "temp_raw_icon"
                            extracted = False

                            # 2. APK İçindeki Gerçek Resim İkonlarını Ara
                            try:
                                with zipfile.ZipFile(temp_apk, 'r') as zip_ref:
                                    all_files = zip_ref.namelist()
                                    
                                    # Sadece PNG/WEBP/JPG ve res/ mipmap/drawable icindeki GERÇEK resimleri filtrele
                                    image_candidates = [
                                        f for f in all_files 
                                        if f.lower().endswith(('.png', '.webp', '.jpg')) 
                                        and not f.endswith('.xml')
                                        and ('ic_launcher' in f or 'app_icon' in f or 'store' in f or 'logo' in f)
                                        and 'sym_def' not in f # Varsayılan android simgesini engelle
                                    ]

                                    # En büyük boyutlu (en yüksek çözünürlüklü) ikonu seç
                                    if image_candidates:
                                        image_candidates.sort(key=lambda x: zip_ref.getinfo(x).file_size, reverse=True)
                                        best_icon = image_candidates[0]
                                        
                                        with open(temp_raw_icon, "wb") as f:
                                            f.write(zip_ref.read(best_icon))
                                        
                                        with Image.open(temp_raw_icon) as img:
                                            # Eğer görsel 48x48 veya aşırı küçükse/yeşil varsayılan simgeyse atla
                                            if img.width >= 72:
                                                img.convert("RGBA").save(icon_path, "PNG")
                                                extracted = True
                                                print(f"  APK içinden ikon çıkarıldı: {best_icon}")
                            except Exception as e:
                                print(f"İç İkon Çıkarma Hatası: {e}")

                            # 3. APK İçinde Resim İkon Yoksa veya Sadece Yeşil Varsayılan Varsa Paket Adından İkonu Çek
                            if not extracted and package_name:
                                print(f"  APK içinde uygun PNG bulunamadı. Paket adından ({package_name}) web ikonu aranıyor...")
                                try:
                                    # DuckDuckGo / Play Store ikon servisi
                                    icon_web_url = f"https://play-lh.googleusercontent.com/" # Fallback
                                    # Google Play Store Web Scrape
                                    store_url = f"https://play.google.com/store/apps/details?id={package_name}"
                                    res = requests.get(store_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=5)
                                    if res.status_code == 200:
                                        match = re.search(r'https://play-lh\.googleusercontent\.com/[^"\'\s]+', res.text)
                                        if match:
                                            img_url = match.group(0)
                                            img_data = requests.get(img_url).content
                                            with open(icon_path, "wb") as f:
                                                f.write(img_data)
                                            extracted = True
                                            print(f"  Web Play Store'dan Orijinal HD İkon Çekildi: {package_name}")
                                except Exception as e:
                                    print(f"  Web İkon İndirme Hatası: {e}")

                            # Temizlik
                            if os.path.exists(temp_apk): os.remove(temp_apk)
                            if os.path.exists(temp_raw_icon): os.remove(temp_raw_icon)

                            apps_list.append({
                                "name": app_name,
                                "fileName": file_name,
                                "downloadUrl": download_url,
                                "icon": f"icons/{icon_filename}" if extracted else ""
                            })

        except Exception as e:
            print(f"API Hatasi: {e}")

        print(f"Toplam Islenen APK Sayisi: {len(apps_list)}")

        with open("apps.json", "w", encoding="utf-8") as f:
            json.dump(apps_list, f, ensure_ascii=False, indent=2)
      shell: python

    - name: Degisiklikleri GitHub Repo'suna Commit Et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apps.json icons/
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: İkonlar gerçek HD PNG/PlayStore kaynağıyla güncellendi" && git push)
